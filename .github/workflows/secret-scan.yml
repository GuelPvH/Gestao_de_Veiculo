name: Segurança — segredos e arquivos sensíveis

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks e política de arquivos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout completo e sem credencial persistida
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bloqueia arquivos sensíveis e Actions mutáveis
        run: bash scripts/audit-sensitive-files.sh

      - name: Varre conteúdo e histórico Git
        run: |
          set -Eeuo pipefail
          # Gitleaks v8.30.1, fixado pelo digest imutável da imagem oficial.
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --no-banner
