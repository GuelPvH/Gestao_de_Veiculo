name: Bug
description: Alguma coisa não funciona como deveria
labels: ["bug"]
body:
  - type: textarea
    id: o-que-acontece
    attributes:
      label: O que acontece
      description: Descreva o comportamento observado.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Passo a passo. Sem isso, o bug provavelmente não será corrigido.
      placeholder: |
        1. make up
        2. Acesse http://localhost:8000/...
        3. Clique em ...
        4. Aparece o erro ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / mensagem de erro
      description: |
        Cole a saída relevante de `docker compose logs --tail 100`.
        Confira antes se não há senha ou token no que você colou.
      render: shell

  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: "Saída de `docker compose ps` e do seu sistema operacional."
      placeholder: |
        SO: Windows 11 + WSL2 (Ubuntu)
        Docker: 29.6.2
        Containers: todos healthy
    validations:
      required: true

  - type: checkboxes
    id: verificacoes
    attributes:
      label: Antes de abrir
      options:
        - label: Rodei `make check` e o erro não é uma falha de teste conhecida
        - label: Confirmei que os containers estão `healthy` (`make ps`)
        - label: Não há credencial real no que colei acima
          required: true
