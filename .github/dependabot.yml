version: 2

# =============================================================================
# O `commit-message.prefix` de cada entrada nao e cosmetico.
#
# O workflow `pr-title.yml` valida o titulo de TODO pull request contra a regex
# de Conventional Commits — inclusive os abertos pelo Dependabot. O titulo
# padrao dele ("Bump laravel/framework from 11.9 to 11.10") nao tem tipo nem
# dois-pontos, entao reprovaria o check e o PR nunca poderia ser mesclado.
#
# Com o prefixo, o titulo vira "chore(deps): bump laravel/framework from ..." —
# que passa. Se `pr-title.yml` mudar de regex, revise estes prefixos.
# =============================================================================

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      laravel:
        patterns: ["laravel/*"]
      quality:
        patterns: ["larastan/*", "rector/*", "driftingly/*", "pestphp/*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "docker"
    directory: "/docker/php"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/docker/nginx"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # O mysql publica duas trilhas no mesmo repositorio de tags: as LTS (8.4, 9.7,
  # apontada por `lts`) e as "innovation" (26.x, apontada por `latest`), que tem
  # janela de suporte curta e podem quebrar compatibilidade entre releases.
  # Como o Dependabot so enxerga "numero maior = mais novo", ele propos pular de
  # 8.4 direto para 26.7 — ou seja, sair da trilha LTS sem querer. O ignore de
  # major mantem as propostas dentro da linha atual; a troca de LTS para LTS
  # (8.4 -> 9.7) e uma decisao manual, feita junto com a migracao dos dados.
  - package-ecosystem: "docker"
    directory: "/docker/mysql"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/node"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
