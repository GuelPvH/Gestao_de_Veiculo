version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*"]
      quality:
        patterns: ["larastan/*", "rector/*", "driftingly/*", "pestphp/*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/docker/php"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/nginx"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/mysql"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/node"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
