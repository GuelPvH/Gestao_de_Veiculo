server {
    listen 80 default_server;
    server_name _;

    # O bind mount do código existe TAMBÉM neste container: o nginx precisa
    # enxergar o arquivo para montar SCRIPT_FILENAME. Se o código só existisse
    # no serviço `app`, toda request viraria "404 File not found".
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health do próprio nginx: não depende do PHP-FPM, então distingue
    # "nginx caiu" de "aplicação caiu".
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        # Neutraliza o cabeçalho Proxy do cliente (httpoxy).
        fastcgi_param HTTP_PROXY      "";

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Nenhum outro .php é executável: impede que um upload vire código.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(?:css|js|mjs|map|json|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Arquivos ocultos ficam fora do alcance (exceto .well-known).
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
