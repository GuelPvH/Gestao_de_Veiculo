; =============================================================================
; Xdebug — carregado, porém DESLIGADO por padrão.
;
; Ligado, ele degrada cada request em 2–3x. A env XDEBUG_MODE (definida no
; compose a partir do .env) tem precedência sobre `xdebug.mode` abaixo:
;
;   XDEBUG_MODE=debug docker compose up -d app
;
; Para cobertura de testes use PCOV, que já está instalado e é muito mais
; rápido que o Xdebug em coverage.
; =============================================================================

xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
xdebug.discover_client_host = false
xdebug.log_level = 0
