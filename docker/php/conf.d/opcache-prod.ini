; =============================================================================
; OPcache — PRODUÇÃO
;
; Timestamps NÃO são revalidados: o código é imutável dentro da imagem, e
; qualquer alteração exige novo build/deploy. Usar este arquivo em dev faz
; suas edições sumirem silenciosamente.
; =============================================================================

opcache.enable = 1

; DESLIGADO no CLI de propósito. Preload é um mecanismo do FPM: com opcache
; ativo no CLI, TODA invocação (composer, artisan) tenta carregar
; `opcache.preload` — e durante o build do estágio prod o arquivo ainda não
; existe, o que aborta o `composer install` com um fatal error obscuro.
; Cada processo CLI é efêmero, então o opcache também não traria ganho.
opcache.enable_cli = 0

opcache.validate_timestamps = 0

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000

opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Preload reduz o custo de bootstrap. O arquivo é conservador por padrão —
; veja storage/opcache-preload.php antes de estendê-lo.
opcache.preload = /var/www/html/storage/opcache-preload.php
opcache.preload_user = www-data
