; Configuração base do PHP — comum a dev e prod.

memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

date.timezone = America/Sao_Paulo

; O banner do PHP não precisa ser anunciado.
expose_php = Off

; Erro nunca é impresso na resposta: quem renderiza é o Laravel. Impresso,
; vazaria HTML no meio de respostas JSON e dado interno para o visitante.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessão do Laravel usa Redis; o handler nativo fica fora do caminho.
session.gc_maxlifetime = 7200
