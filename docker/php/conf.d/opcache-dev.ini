; =============================================================================
; OPcache — DESENVOLVIMENTO
;
; `validate_timestamps=0` é o default de produção e faz suas alterações de
; código NÃO aparecerem no navegador. Aqui ele fica ligado com revalidação
; imediata: salvou o arquivo, a próxima request já usa a versão nova.
; =============================================================================

opcache.enable = 1
opcache.enable_cli = 0

opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; JIT desligado em dev: complica o stack trace e não traz ganho aqui.
opcache.jit = off
opcache.jit_buffer_size = 0
