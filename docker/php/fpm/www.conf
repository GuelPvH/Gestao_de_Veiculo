; =============================================================================
; Pool FPM da aplicação.
;
; O master do FPM inicia como root e IMEDIATAMENTE faz setuid dos workers para
; www-data (diretivas abaixo). Quem executa código da aplicação são os
; workers — a aplicação nunca roda como root.
;
; Rodar o master já como www-data parece mais seguro e não é: ele perde a
; capacidade de abrir /proc/self/fd/2 (o stderr do container pertence ao root),
; e o FPM aborta com "failed to open error_log ... Permission denied" antes de
; sequer inicializar. Todo comando que NÃO é php-fpm continua sendo executado
; como www-data pelo entrypoint.
; =============================================================================

[www]

user  = www-data
group = www-data

listen = 9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.process_idle_timeout = 10s

; -----------------------------------------------------------------------------
; Endpoints de status. PHP-FPM não fala HTTP: quem consulta é o healthcheck via
; FastCGI (docker/php/healthcheck.sh). `curl localhost` no container app SEMPRE
; falha — um healthcheck errado mantém o serviço `unhealthy` e trava todo
; `depends_on` que aponta para ele.
; -----------------------------------------------------------------------------
pm.status_path = /fpm-status
ping.path      = /fpm-ping
ping.response  = pong

; Variáveis de ambiente do container chegam ao PHP (Laravel também lê o .env).
clear_env = no

; Logs vão para o stdout/stderr do container, não para arquivo dentro dele.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

request_terminate_timeout = 300
